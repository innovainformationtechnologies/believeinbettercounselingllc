<div class="portfolio_item_container">
    <div class="portfolio_item_body">
        <img class="portfolio_item_image" src="img/logo.png" alt="portfolio item image">
        <h2 class="text1">Portfolio Item</h2>
        <p class="text2">
            Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed sit amet nulla eget elit dictum varius. Maecenas risus mi, porta mattis nulla vitae, ultricies lorem.
        </p>
    </div>
    <style>
        .portfolio_item_container{
            /* width: 80vw; */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 10vh auto;
            transition: all 0.5s ease-in-out;
            &:hover{
                transform: scale(1.5);
            }
        }
        .portfolio_item_body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .portfolio_item_image{
            height: 25vh;
            width: 100%;
            object-fit: cover;
            border-radius: 1rem;
        }
        @media screen and (max-width:1000) {
            .portfolio_item_container{
                width: 100%;
            }
            .portfolio_item_image{
                width: 100% !important;
            }
        }
    </style>
    <script>
        (function(){
            function init(data){
                const element = document.getElementById(`${data.id}`)
                element.querySelector(".text1").innerHTML = data.text1
                element.querySelector(".text2").innerHTML = data.text2
                element.querySelector("img").src = data.image_url
                // if(window.innerWidth > 1000){
                //     element.style.maxWidth = "17vw"
                //     element.style.margin = "auto"
                // }
                // if(window.innerWidth < 1000){
                //     element.style.maxWidth = "80vw"
                //     element.style.margin = "auto"
                // }   
            }

            window.componentRegistry.register("portfolio_item", init)
        })()
    </script>
</div>
