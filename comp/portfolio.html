<div>
    <style>
        .portfolio_container{
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 10vh auto;
            order: -1;
        }
        .portfolio_body{
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
    <script>
        (function(){
            function init(data){
                const element = document.getElementById(`${data.id}`)
                element.style.display = "grid"
                element.style.gridTemplateColumns = "repeat(auto-fill, minmax(300px, 1fr))"
                element.style.gap = "10px"
                element.style.margin = "auto"
                element.style.maxWidth = "80vw"
            }
            window.componentRegistry.register("portfolio", init)
        })()
    </script>
</div>
