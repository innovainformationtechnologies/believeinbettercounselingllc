<div>
    <div id="contact" class="container">
        <div class="contact_body">
            <h2 class="text1">Subscribe to our newsletter</h2>
            <form>
                <input type="email" placeholder="Enter your email">
                <input type="submit" value=">">
            </form>
        </div>
    </div>
    <style>
        .contact_body{
            margin: 10vh auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        form{
            border: 1px solid var(--text);
            width: fit-content;
            margin: auto;
            &>input{
                border: none;
                background-color: transparent;
                padding: 1rem;
                &::placeholder{
                    color: var(--text);
                }
            }
            &>input[type="submit"]{
                border: none;
                background-color: transparent;
                color: var(--text);
            }
        }
    </style>
    <script>
        (function(){

            function submit(e, endpoint){
                e.preventDefault()
                let email = e.target[0].value
                fetch("/api/subscribe", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email
                    })
                })
            }
            function init(data){
                const contact = document.querySelector("#contact")
                contact.querySelector(".text1").textContent = data.text
                contact.querySelector("form").addEventListener("submit", (e) => {
                    submit(e, data.endpoint)
                })
            }

            window.componentRegistry.register("contact", init)
        })()
    </script>
</div>
